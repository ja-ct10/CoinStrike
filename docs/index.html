import sys
import asyncio
import platform
import json
from pathlib import Path

# do not rename
async def custom_site():
    import embed
    platform.document.body.style.background = "#060410"

    # platform.window.transfer.hidden = true
    platform.window.canvas.style.visibility = "visible"


    bundle = "coinstrike"

    # the C or js loader could do that but be explicit.
    appdir = Path(f"/data/data/{bundle}") # /data/data/coinstrike
    appdir.mkdir()


    # unpack filesystem from compressed archive into work dir
    if platform.window.location.host.find('.itch.zone')>0:
        import zipfile
        async with platform.fopen("coinstrike.apk", "rb") as archive:
            with zipfile.ZipFile(archive) as zip_ref:
                zip_ref.extractall(appdir.as_posix())
    else:
        import tarfile
        async with platform.fopen("coinstrike.tar.gz", "rb") as archive:
            tar = tarfile.open(fileobj=archive, mode="r:gz")
            tar.extractall(path=appdir.as_posix(), filter='tar')
            tar.close()

    # preloader will change to work dir and prepend it to sys.path
    platform.run_main(PyConfig, loaderhome= appdir / "assets", loadermain=None)


    # wait preloading complete : that includes images and wasm compilation of bundled modules
    while embed.counter()<0:
        await asyncio.sleep(.1)

    main = appdir / "assets" / "main.py"

    # TODO: test for window.webkitAudioContext and block aio loop until gesture if accessing media manager play
    # before a gesture is recorded ( touch or click )

    # test/wait user media interaction
    if not platform.window.MM.UME:

        # now that apk is mounted we have access to font cache
        # but we need to fill __file__ that is not yet set
        __import__(__name__).__file__ = main

        # now make a prompt
        msg  = "ENTER COINSTRIKE"
        platform.window.infobox.innerText = msg
        try:
            platform.document.getElementById("progress").style.display = "none"
            platform.document.getElementById("status").innerText = "READY TO PLAY"
        except Exception:
            pass
        print("\n"*4, f"    * Waiting for media user engagement. {msg} *" , "\n"*4)

        while not platform.window.MM.UME:
            await asyncio.sleep(.1)

    # start async top level machinery if not started and add a console in any case if requested.
    await TopLevel_async_handler.start_toplevel(platform.shell, console=window.python.config.debug)

    # now that apk is mounted we have access to font cache
    # but we need to fill __file__/__name__ that are not yet set
    __import__(__name__).__file__ = main


    def ui_callback(pkg):
        platform.window.infobox.innerText = f"installing {pkg}"

    await shell.source(main, callback=ui_callback)

    # if you don't reach that step
    # your main.py has an infinite sync loop somewhere !

    platform.window.transfer.style.display = "none"
    platform.window.infobox.style.display = "none"
    platform.window.config.gui_divider = 1
    platform.window.window_resize()
    print("default.tmpl: done")

    shell.interactive()

asyncio.run( custom_site() )

    <script type="application/javascript">
    // Keep the logical framebuffer fixed; only CSS placement follows the safe viewport.
    (() => {
        const gameCanvas = document.getElementById("canvas");
        const overlay = document.getElementById("rotate-overlay");
        const entry = document.getElementById("infobox");
        const fullscreenButton = document.getElementById("rotate-fullscreen");
        const state = { snapshot: "" };
        window.coinstrikeTouch = state;
        let reset = 0;
        let touched = false;
        let portraitBlocked = false;
        let attemptedFullscreen = false;
        let orientationLocked = false;
        const coarse = window.matchMedia("(any-pointer: coarse)");

        function mobileDevice() {
            return Boolean(navigator.userAgentData?.mobile ||
                /Android|iPhone|iPad|iPod/i.test(navigator.userAgent || "") ||
                (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1) ||
                (navigator.maxTouchPoints > 0 && window.matchMedia("(pointer: coarse)").matches));
        }
        function viewport() {
            const view = window.visualViewport;
            const style = getComputedStyle(document.body);
            const x = view?.offsetLeft || 0, y = view?.offsetTop || 0;
            return {
                x, y, width: view?.width || window.innerWidth, height: view?.height || window.innerHeight,
                left: parseFloat(style.paddingLeft) || 0, right: parseFloat(style.paddingRight) || 0,
                top: parseFloat(style.paddingTop) || 0, bottom: parseFloat(style.paddingBottom) || 0
            };
        }
        function refresh() {
            const rect = gameCanvas.getBoundingClientRect();
            const view = viewport();
            state.snapshot = JSON.stringify({
                touch: touched || navigator.maxTouchPoints > 0 || coarse.matches,
                width: rect.width, height: rect.height, reset, portraitBlocked,
                left: Math.max(0, view.x + view.left - rect.left),
                right: Math.max(0, rect.right - (view.x + view.width - view.right)),
                bottom: Math.max(0, rect.bottom - (view.y + view.height - view.bottom))
            });
        }
        function fit() {
            const view = viewport();
            const width = Math.max(1, view.width - view.left - view.right);
            const height = Math.max(1, view.height - view.top - view.bottom);
            const scale = Math.min(width / 1024, height / 576);
            Object.assign(gameCanvas.style, {
                position: "fixed", margin: "0", right: "auto", bottom: "auto",
                width: `${1024 * scale}px`, height: `${576 * scale}px`,
                left: `${view.x + view.left + (width - 1024 * scale) / 2}px`,
                top: `${view.y + view.top + (height - 576 * scale) / 2}px`
            });
            const blocked = mobileDevice() && view.width < view.height;
            if (blocked !== portraitBlocked) { reset++; portraitBlocked = blocked; }
            overlay.hidden = !blocked;
            entry.disabled = blocked;
            refresh();
        }
        function cancel() { reset++; fit(); }
        function fullscreen() { return document.fullscreenElement || document.webkitFullscreenElement; }
        function releaseOrientation() {
            if (orientationLocked && !fullscreen()) {
                try { window.screen.orientation.unlock(); } catch (_) { /* Browser may unlock automatically. */ }
                orientationLocked = false;
            }
        }
        async function enterFullscreen(retry) {
            if (attemptedFullscreen && !retry) return;
            attemptedFullscreen = true;
            const root = document.documentElement;
            const request = root.requestFullscreen || root.webkitRequestFullscreen;
            if (!request) return;
            try {
                if (!fullscreen()) await request.call(root);
                if (fullscreen() && mobileDevice() && window.screen?.orientation?.lock) {
                    await window.screen.orientation.lock("landscape");
                    orientationLocked = true;
                }
            } catch (_) { /* Viewport fit and manual rotation remain available. */ }
            finally { releaseOrientation(); cancel(); }
        }
        entry.addEventListener("click", () => enterFullscreen(false));
        fullscreenButton.addEventListener("click", () => enterFullscreen(true));
        gameCanvas.addEventListener("touchstart", () => {
            if (!touched) { touched = true; refresh(); }
        }, { passive: true });
        gameCanvas.addEventListener("touchcancel", cancel, { passive: true });
        window.addEventListener("blur", cancel);
        window.addEventListener("pagehide", cancel);
        window.addEventListener("resize", cancel);
        window.addEventListener("orientationchange", cancel);
        if (window.screen?.orientation?.addEventListener) window.screen.orientation.addEventListener("change", cancel);
        for (const name of ["fullscreenchange", "webkitfullscreenchange"]) {
            document.addEventListener(name, () => { releaseOrientation(); cancel(); });
        }
        document.addEventListener("visibilitychange", () => { if (document.hidden) cancel(); });
        window.addEventListener("pointerup", event => {
            if (event.pointerType !== "mouse") return;
            const rect = gameCanvas.getBoundingClientRect();
            if (event.clientX < rect.left || event.clientX > rect.right ||
                event.clientY < rect.top || event.clientY > rect.bottom) cancel();
        });
        if (coarse.addEventListener) coarse.addEventListener("change", refresh);
        if (window.visualViewport) window.visualViewport.addEventListener("resize", cancel);
        new ResizeObserver(refresh).observe(gameCanvas);
        state.fit = fit;
        fit();
    })();

    globalThis.__canvas_resized = (self, ecw, ech) => {
        window.coinstrikeTouch.fit();
    }
